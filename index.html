<!doctype html>
<html lang="uk" data-theme="omet-clean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АРМ «Розклади» — КП «Одесміськелектротранс»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('omet_theme');
          // If unassigned or legacy dark default, force default to clean light theme
          if (!savedTheme || savedTheme === 'dark' || savedTheme === 'system') {
            savedTheme = 'omet-clean';
            localStorage.setItem('omet_theme', 'omet-clean');
          }
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'night-dispatch') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'omet-clean');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans" data-theme="omet-clean">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
