services:
  postgres:
    image: postgres:15-alpine
    container_name: omet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omet_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: omet_db
      TZ: Europe/Kyiv
    ports:
      - "5433:5432" # 5433 на хості для уникнення конфліктів, 5432 всередині мережі
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: omet_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@omet.ua
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: omet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omet_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://omet_admin:secure_password_123@postgres:5432/omet_db
      REDIS_URL: redis://redis:6379/0
      TZ: Europe/Kyiv
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omet_frontend
    restart: unless-stopped
    ports:
      - "80:80" # Веб-додаток доступний на http://localhost
    depends_on:
      - backend

  db_backup:
    image: postgres:15-alpine
    container_name: omet_db_backup
    restart: unless-stopped
    environment:
      PGUSER: omet_admin
      PGPASSWORD: secure_password_123
      PGHOST: postgres
      PGDATABASE: omet_db
      TZ: Europe/Kyiv
    volumes:
      - ./backups:/backups
    # Вбудований планувальник (cron) запускає створення дампу щодня о 03:00 ночі
    entrypoint: |
      sh -c 'echo "0 3 * * * pg_dump -Fc > /backups/omet_db_$$(date +\%Y\%m\%d_\%H\%M\%S).dump" > /etc/crontabs/root && crond -f -d 8'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
